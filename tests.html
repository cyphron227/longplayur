<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Longplayur tests</title>
<style>
  body { background: #121212; color: #DCD7CB; font-family: ui-monospace, monospace; padding: 24px; font-size: 13px; }
  h1 { font-size: 16px; }
  .pass { color: #6B7C5E; }
  .fail { color: #D98A7A; }
  #summary { margin-top: 16px; font-weight: bold; }
</style>
</head>
<body>
<h1>Longplayur &middot; pure function tests</h1>
<div id="results"></div>
<div id="summary"></div>

<script type="module">
import { detectEndFromSdkStates, detectEndFromConnectSnapshots } from './js/ending.js';
import { streakDays } from './js/journal.js';
import { filterPool, sortPool, groupKeyFor, UNKNOWN_GENRE, SORT_MODES } from './js/flip.js';
import { buildRunoutGrid } from './js/runout.js';

const results = document.getElementById('results');
let passCount = 0;
let failCount = 0;

function assert(condition, description) {
  const line = document.createElement('div');
  if (condition) {
    passCount += 1;
    line.className = 'pass';
    line.textContent = `PASS  ${description}`;
  } else {
    failCount += 1;
    line.className = 'fail';
    line.textContent = `FAIL  ${description}`;
  }
  results.appendChild(line);
}

function group(title) {
  const h = document.createElement('div');
  h.style.marginTop = '16px';
  h.style.color = '#9D998F';
  h.textContent = `-- ${title} --`;
  results.appendChild(h);
}

function eq(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

// Wall layout (tile placement, rotation math) now lives inside the forked
// DomeGallery React component (gallery/src/DomeGallery.tsx), compiled to
// js/dome-gallery.bundle.js. It is intentionally left as close to the
// upstream react-bits source as possible (see the comment at the top of
// that file for the four deliberate changes), so there is no standalone
// pure layout function of this app's own left to unit test here the way
// spiralPosition/spherePosition were in earlier iterations.

// ---------- ending detection (SDK path) ----------
// SDK state shape (subset used): { track_window: { current_track: { id, duration_ms }, next_tracks: [] },
//   position, duration, paused }

group('detectEndFromSdkStates: normal end of album');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 179000, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } },
    { paused: true, position: 0, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } }
  ) === true,
  'last track pauses at position 0 with no next tracks -> end'
);

group('detectEndFromSdkStates: track skip near end does not false-trigger');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 179000, duration: 180000, track_window: { current_track: { id: 't2' }, next_tracks: [{ id: 't3' }] } },
    { paused: false, position: 0, duration: 200000, track_window: { current_track: { id: 't3' }, next_tracks: [] } }
  ) === false,
  'advancing to a new track (even the last one) is not itself the end'
);

group('detectEndFromSdkStates: pause near end (user-paused) does not false-trigger');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 175000, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } },
    { paused: true, position: 176000, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } }
  ) === false,
  'pausing mid-track (not at 0) is not the end'
);

group('detectEndFromSdkStates: scrub to 0 on last track does not false-trigger');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 175000, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } },
    { paused: false, position: 0, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } }
  ) === false,
  'scrubbing to 0 while still playing is not the end'
);

group('detectEndFromSdkStates: single-track album ends correctly');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 179000, duration: 180000, track_window: { current_track: { id: 't1' }, next_tracks: [] } },
    { paused: true, position: 0, duration: 180000, track_window: { current_track: { id: 't1' }, next_tracks: [] } }
  ) === true,
  'single-track album: pause at 0 with no next tracks -> end'
);

group('detectEndFromSdkStates: context change mid-album does not false-trigger');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 90000, duration: 180000, track_window: { current_track: { id: 't2' }, next_tracks: [{ id: 't3' }] } },
    { paused: true, position: 0, duration: 210000, track_window: { current_track: { id: 'other-album-t1' }, next_tracks: [{ id: 'x' }] } }
  ) === false,
  'switching context (different album) is not the end of the previous album'
);

group('detectEndFromSdkStates: device switch (state briefly null) does not false-trigger');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 90000, duration: 180000, track_window: { current_track: { id: 't2' }, next_tracks: [{ id: 't3' }] } },
    null
  ) === false,
  'a null next state (device switch) never signals end'
);

group('detectEndFromSdkStates: repeat-on (loops back to track 1) does not false-trigger');
assert(
  detectEndFromSdkStates(
    { paused: false, position: 179000, duration: 180000, track_window: { current_track: { id: 't3' }, next_tracks: [] } },
    { paused: false, position: 0, duration: 200000, track_window: { current_track: { id: 't1' }, next_tracks: [{ id: 't2' }, { id: 't3' }] } }
  ) === false,
  'repeat-on restarting the album is not the end'
);

// ---------- ending detection (Connect polling path) ----------
// Snapshot shape: { isPlaying, progressMs, durationMs, trackNumber, totalTracksInAlbum, trackId }

group('detectEndFromConnectSnapshots: normal end of album');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 178000, durationMs: 180000, trackNumber: 10, totalTracksInAlbum: 10, trackId: 't10' },
    { isPlaying: false, progressMs: 0, durationMs: 0, trackNumber: null, totalTracksInAlbum: null, trackId: null }
  ) === true,
  'last track nearly finished, then playback stops/resets -> end'
);

group('detectEndFromConnectSnapshots: skip to next album does not false-trigger');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 178000, durationMs: 180000, trackNumber: 5, totalTracksInAlbum: 10, trackId: 't5' },
    { isPlaying: true, progressMs: 1000, durationMs: 210000, trackNumber: 1, totalTracksInAlbum: 8, trackId: 'y1' }
  ) === false,
  'jumping to a different album mid-way is not the end'
);

group('detectEndFromConnectSnapshots: pause near end does not false-trigger');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 175000, durationMs: 180000, trackNumber: 10, totalTracksInAlbum: 10, trackId: 't10' },
    { isPlaying: false, progressMs: 176000, durationMs: 180000, trackNumber: 10, totalTracksInAlbum: 10, trackId: 't10' }
  ) === false,
  'user pausing near the end (not stopped/reset) is not the end'
);

group('detectEndFromConnectSnapshots: scrub to 0 does not false-trigger');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 175000, durationMs: 180000, trackNumber: 10, totalTracksInAlbum: 10, trackId: 't10' },
    { isPlaying: true, progressMs: 0, durationMs: 180000, trackNumber: 10, totalTracksInAlbum: 10, trackId: 't10' }
  ) === false,
  'scrubbing to 0 while still playing is not the end'
);

group('detectEndFromConnectSnapshots: single-track album ends correctly');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 178000, durationMs: 180000, trackNumber: 1, totalTracksInAlbum: 1, trackId: 't1' },
    { isPlaying: false, progressMs: 0, durationMs: 0, trackNumber: null, totalTracksInAlbum: null, trackId: null }
  ) === true,
  'single-track album: near-end then stop -> end'
);

group('detectEndFromConnectSnapshots: context change mid-album does not false-trigger');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 90000, durationMs: 180000, trackNumber: 4, totalTracksInAlbum: 10, trackId: 't4' },
    { isPlaying: false, progressMs: 0, durationMs: 0, trackNumber: null, totalTracksInAlbum: null, trackId: null }
  ) === false,
  'stopping well before the end of the last track is not the end'
);

group('detectEndFromConnectSnapshots: device switch does not false-trigger');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 90000, durationMs: 180000, trackNumber: 4, totalTracksInAlbum: 10, trackId: 't4' },
    null
  ) === false,
  'a null next snapshot (device switch) never signals end'
);

group('detectEndFromConnectSnapshots: repeat-on does not false-trigger');
assert(
  detectEndFromConnectSnapshots(
    { isPlaying: true, progressMs: 178000, durationMs: 180000, trackNumber: 10, totalTracksInAlbum: 10, trackId: 't10' },
    { isPlaying: true, progressMs: 1000, durationMs: 180000, trackNumber: 1, totalTracksInAlbum: 10, trackId: 't1' }
  ) === false,
  'repeat-on restarting at track 1 while still playing is not the end'
);

// ---------- listening streak (journal.js's streakDays, pure) ----------
// Entries only need a startedAt timestamp for this function; days are
// anchored to midday so a run near midnight can't tip a case into the
// adjacent calendar day and make the assertion flaky.
function daysAgoTimestamp(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  d.setHours(12, 0, 0, 0);
  return d.getTime();
}
function sessionWithEntriesDaysAgo(...daysAgoList) {
  return { entries: daysAgoList.map((n) => ({ startedAt: daysAgoTimestamp(n) })) };
}

group('streakDays: no sessions');
assert(streakDays([]) === 0, 'an empty sessions array is a 0-day streak');

group('streakDays: single session today');
assert(streakDays([sessionWithEntriesDaysAgo(0)]) === 1, 'one entry today is a 1-day streak');

group('streakDays: a broken streak only counts its still-connected tail');
assert(
  streakDays([sessionWithEntriesDaysAgo(3, 1)]) === 1,
  'entries 3 and 1 days ago (gap at 2, none today) counts only yesterday: 1'
);

group('streakDays: a streak ending yesterday still counts');
assert(
  streakDays([sessionWithEntriesDaysAgo(3, 2, 1)]) === 3,
  'entries on the 3 consecutive days up to yesterday (none today) count as a live 3-day streak'
);

group('streakDays: a streak ending two days ago has lapsed');
assert(
  streakDays([sessionWithEntriesDaysAgo(4, 3, 2)]) === 0,
  'entries on 3 consecutive days ending 2 days ago (nothing yesterday or today) resets to 0'
);

// ---------- Flip: filterPool/sortPool/groupKeyFor (pure functions) ----------
const FLIP_POOL = [
  { id: 'a1', name: 'Rumours', artist: 'Fleetwood Mac', genre: 'Rock' },
  { id: 'a2', name: 'Blue Lines', artist: 'Massive Attack', genre: 'Trip Hop' },
  { id: 'a3', name: 'Dummy', artist: 'Portishead', genre: 'Trip Hop' },
  { id: 'a4', name: 'Illmatic', artist: 'Nas', genre: null },
];
const idsOf = (list) => list.map((e) => e.id);

group('flip.filterPool: matches artist, title, or genre, case-insensitively');
assert(eq(idsOf(filterPool(FLIP_POOL, 'nas')), ['a4']), 'artist-name match ("nas" -> Nas)');
assert(eq(idsOf(filterPool(FLIP_POOL, 'RUMOURS')), ['a1']), 'title match, case-insensitive');
assert(eq(idsOf(filterPool(FLIP_POOL, 'trip hop')), ['a2', 'a3']), 'genre match hits every entry sharing it');
assert(eq(idsOf(filterPool(FLIP_POOL, '')), ['a1', 'a2', 'a3', 'a4']), 'an empty query returns the whole pool, unfiltered');
assert(eq(idsOf(filterPool(FLIP_POOL, 'xyz')), []), 'no match anywhere returns an empty array, not an error');

group('flip.sortPool: alpha sorts by artist, then title');
assert(eq(idsOf(sortPool(FLIP_POOL, SORT_MODES.ALPHA)), ['a1', 'a2', 'a4', 'a3']), 'Fleetwood Mac, Massive Attack, Nas, Portishead');

group('flip.sortPool: genre groups alphabetically, unresolved genre sorts under Unknown');
assert(eq(idsOf(sortPool(FLIP_POOL, SORT_MODES.GENRE)), ['a1', 'a2', 'a3', 'a4']), 'Rock, then Trip Hop (Massive Attack before Portishead), then Unknown');

group('flip.sortPool: recent sorts most-recently-played first, using the supplied playedAt map');
assert(
  eq(idsOf(sortPool(FLIP_POOL, SORT_MODES.RECENT, { playedAt: new Map([['a3', 300], ['a1', 100]]) })), ['a3', 'a1', 'a2', 'a4']),
  'a3 (300) then a1 (100) then the two never-played entries in their original order'
);

group('flip.sortPool: unplayed filters out anything present in the playedAt map');
assert(
  eq(idsOf(sortPool(FLIP_POOL, SORT_MODES.UNPLAYED, { playedAt: new Map([['a3', 300], ['a1', 100]]) })), ['a2', 'a4']),
  'only the two entries absent from playedAt remain'
);

group('flip.groupKeyFor: alpha groups by the artist\'s first letter, genre by genre (or Unknown), others ungrouped');
assert(groupKeyFor(FLIP_POOL[0], SORT_MODES.ALPHA) === 'F', 'Fleetwood Mac groups under F');
assert(groupKeyFor(FLIP_POOL[3], SORT_MODES.GENRE) === UNKNOWN_GENRE, 'an entry with no resolved genre groups under Unknown, never invented');
assert(groupKeyFor(FLIP_POOL[0], SORT_MODES.RECENT) === null, 'recent/unplayed have no natural sticky-header grouping');

// ---------- Runout groove: buildRunoutGrid (pure direction-selection logic) ----------
const RUNOUT_FINISHED = {
  id: 'f1', name: 'Dummy', artist: 'Portishead', artistId: 'artist-portishead',
  image: 'img-f1', releaseDate: '1994-08-22', totalTracks: 11, genre: 'trip hop',
};

const RUNOUT_FULL_CONTEXT = {
  finished: RUNOUT_FINISHED,
  artistOtherAlbums: [{ id: 'a-other1', name: 'Third', artist: 'Portishead', image: 'img-a1' }],
  poolWithGenre: [
    { id: 'p-genre', name: 'Blue Lines', artist: 'Massive Attack', genre: 'trip hop', releaseDate: '1991-04-08' },
    { id: 'p-year', name: 'Illmatic', artist: 'Nas', genre: 'hip hop', releaseDate: '1994-04-19' },
    { id: 'p-leftturn', name: 'Zombie', artist: 'Fela Kuti', genre: 'afrobeat', releaseDate: '1976-01-01' },
  ],
  related: [{ id: 'p-related', name: 'Untrue', artist: 'Burial', image: 'img-related' }],
  journalPicks: {
    hasTagSchema: true,
    keeperEntries: [{ id: 'p-keeper', name: 'Voodoo', artist: "D'Angelo", image: 'img-keeper' }],
    playedEntries: [{ id: 'p-played', name: 'Some Played Album', artist: 'X', image: 'img-played' }],
  },
  poolSource: { type: 'own', pool: [{ id: 'p-unplayed', name: 'Homogenic', artist: 'Björk', image: 'img-unplayed' }] },
  newArrivalsPool: [{ id: 'p-arrival', name: 'New Thing', artist: 'Someone', image: 'img-arrival' }],
  playedIds: new Set(),
};

group('buildRunoutGrid: a fully-populated context fills all 9 directions, in order');
{
  const cells = buildRunoutGrid(RUNOUT_FULL_CONTEXT);
  const directions = cells.map((c) => c.direction);
  assert(cells.length === 9, `all 9 directions honestly fillable -> 9 cells (got ${cells.length})`);
  assert(
    eq(directions, [
      'More from this artist', 'Same genre', 'Same year, 1994', 'Related', 'From your crate',
      'Unplayed on your Wall', 'New arrival', 'A left turn', 'Play it again',
    ]),
    'directions appear in the fixed 1-9 order'
  );
  assert(cells[7].wildcard === true, 'direction 8 (a left turn) is flagged wildcard for the ember-accent styling');
  assert(cells.slice(0, 7).concat(cells[8]).every((c) => c.wildcard === false), 'every other direction is not a wildcard');
  // Direction 9 falls back to "Play it again" here because the only
  // keeper-tagged album was already used by direction 5 ("From your
  // crate") -- confirms the used-id de-duplication between 5 and 9.
  assert(cells[8].entry.id === RUNOUT_FINISHED.id, 'direction 9 replays the finished album itself once its one keeper was already used by direction 5');
}

group('buildRunoutGrid: a sparse pool that cannot fill all 9 shrinks, never pads');
{
  const sparseFinished = {
    id: 'sf1', name: 'Solo Album', artist: 'Obscure Artist', artistId: 'artist-obscure',
    image: null, releaseDate: null, totalTracks: 8, genre: null,
  };
  const cells = buildRunoutGrid({
    finished: sparseFinished,
    artistOtherAlbums: [],
    poolWithGenre: [],
    related: [],
    journalPicks: { hasTagSchema: false, keeperEntries: [], playedEntries: [] },
    poolSource: { type: 'own', pool: [] },
    newArrivalsPool: null,
    playedIds: new Set(),
  });
  assert(cells.length === 1, `nothing else fillable (no genre, no year, no artist/related/journal/pool/arrivals data) -> only "Play it again" (got ${cells.length})`);
  assert(cells[0].direction === 'Play it again' && cells[0].entry.id === sparseFinished.id, 'the one surviving cell replays the finished album itself, not a duplicate or invented pick');
}

group('buildRunoutGrid: "Played before" is the fallback when the tag schema does not exist or has nothing tagged');
{
  const cells = buildRunoutGrid({
    finished: RUNOUT_FINISHED,
    artistOtherAlbums: [],
    poolWithGenre: [],
    related: [],
    journalPicks: { hasTagSchema: false, keeperEntries: [], playedEntries: [{ id: 'p-played2', name: 'X', artist: 'Y', image: null }] },
    poolSource: { type: 'other', pool: [] },
    newArrivalsPool: null,
    playedIds: new Set(),
  });
  const directions = cells.map((c) => c.direction);
  assert(directions.includes('Played before'), 'falls back to "Played before" rather than "From your crate" when hasTagSchema is false');
  assert(!directions.includes('From your crate'), 'never claims "From your crate" without an actual keeper-tagged album');
}

group('buildRunoutGrid: direction 6 labels "Unplayed in this bag" for any non-own pool origin');
{
  const cells = buildRunoutGrid({
    finished: RUNOUT_FINISHED,
    artistOtherAlbums: [],
    poolWithGenre: [],
    related: [],
    journalPicks: { hasTagSchema: false, keeperEntries: [], playedEntries: [] },
    poolSource: { type: 'other', pool: [{ id: 'p-unplayed2', name: 'Y', artist: 'Z', image: null }] },
    newArrivalsPool: null,
    playedIds: new Set(),
  });
  assert(cells.some((c) => c.direction === 'Unplayed in this bag' && c.entry.id === 'p-unplayed2'), 'a bag/playlist/search/new-arrivals-origin pool labels its unplayed pick "in this bag", not "on your Wall"');
}

// ---------- summary ----------

const summary = document.getElementById('summary');
summary.textContent = `${passCount} passed, ${failCount} failed`;
summary.className = failCount === 0 ? 'pass' : 'fail';
window.__testResults = { passCount, failCount };
</script>
</body>
</html>
